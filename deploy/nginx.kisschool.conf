# =============================================================================
# PRODUCTION nginx vhost for kisschool.in (KIS School Management — served at ROOT)
# =============================================================================
# Standalone server block — install to /etc/nginx/conf.d/kisschool.conf.
# Coexists with the existing enamfoss vhost (server_name 69.62.72.137, the bare
# IP), since this block matches the kisschool.in / www.kisschool.in hostnames.
#
# SSL cert is obtained once with:
#   certbot certonly --nginx -d kisschool.in -d www.kisschool.in
# (after a temporary HTTP-only vhost is in place). This file is then installed
# and references the resulting cert under /etc/letsencrypt/live/kisschool.in/.
#
# URL layout (ROOT — longest-prefix wins, so order here is cosmetic):
#   https://kisschool.in/api/*        → FastAPI on 127.0.0.1:8000   (proxy)
#   https://kisschool.in/admin/*      → React staff portal SPA
#   https://kisschool.in/downloads/*  → static files (Android APK, etc.)
#   https://kisschool.in/*            → public marketing site (Eleventy)

# ── HTTP :80 — redirect everything to HTTPS (ACME challenges handled by the
#    certbot nginx authenticator, which inserts its own location at renew time) ─
server {
    listen 80;
    listen [::]:80;
    server_name kisschool.in www.kisschool.in;
    return 301 https://kisschool.in$request_uri;
}

# ── HTTPS :443 ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kisschool.in www.kisschool.in;

    ssl_certificate     /etc/letsencrypt/live/kisschool.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kisschool.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Canonicalise www → apex.
    if ($host = www.kisschool.in) {
        return 301 https://kisschool.in$request_uri;
    }

    # Allow large file uploads (student docs).
    client_max_body_size 25m;

    # ── 1. FastAPI ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE-friendly settings (covers /api/stream/* too)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ── 2. React staff portal SPA (Vite-built; base "/admin/") ───────────────
    location = /admin { return 302 /admin/; }

    location /admin/ {
        alias /opt/school-management/frontend/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # index.html + version.json must always be revalidated so a fresh deploy
    # reaches the browser immediately. Vite's hashed assets under /assets/ are
    # inherently cache-safe (filename changes on every build).
    location = /admin/ {
        alias /opt/school-management/frontend/dist/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }
    location = /admin/index.html {
        alias /opt/school-management/frontend/dist/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }
    location = /admin/version.json {
        alias /opt/school-management/frontend/dist/version.json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    # ── 3. Direct-download passthrough (Android APK + future) ────────────────
    location /downloads/ {
        alias /opt/school-management/frontend/dist/downloads/;
    }

    # ── 4. Public marketing site (Eleventy static; mounted at apex root) ─────
    location / {
        root /opt/school-management/public-site/dist;
        # Pretty URLs: /en/admissions → /en/admissions/index.html
        # Root → /index.html which JS-redirects to /en/ or /pa/
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
    }
}
