# Public marketing site (Khalsa International) — static Eleventy build.
#
# This is a TEMPLATE. Pick one of the two integration patterns below
# depending on whether the public site is on its own domain
# (khalsainternational.in) or sharing the existing expressonly.in host
# under a sub-path.
#
# Once placed and `nginx -t` passes, reload with `systemctl reload nginx`.

# ──────────────────────────────────────────────────────────────────────────
#  Pattern A — own domain (recommended for production)
# ──────────────────────────────────────────────────────────────────────────
#  Use when khalsainternational.in DNS points at this server and you have a
#  Let's Encrypt cert for it. Keep expressonly.in's existing server { } block
#  untouched.
#
#  /etc/nginx/sites-available/khalsainternational
#
# server {
#     listen 80;
#     server_name khalsainternational.in www.khalsainternational.in;
#     return 301 https://www.khalsainternational.in$request_uri;
# }
#
# server {
#     listen 443 ssl http2;
#     server_name khalsainternational.in www.khalsainternational.in;
#
#     ssl_certificate     /etc/letsencrypt/live/khalsainternational.in/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/khalsainternational.in/privkey.pem;
#
#     root /opt/school-management/public-site/dist;
#     index index.html;
#
#     # Locale-aware: /  → 11ty's redirect index that JS-routes to /en or /pa.
#     # Pretty URLs: /en/admissions  →  /en/admissions/index.html
#     location / {
#         try_files $uri $uri/ $uri.html $uri/index.html =404;
#     }
#
#     # Static admin portal lives on a different host (expressonly.in/school/)
#     # so we don't need a /school/ proxy here.
# }

# ──────────────────────────────────────────────────────────────────────────
#  Pattern B — co-hosted under expressonly.in/info/  (TEST ONLY)
# ──────────────────────────────────────────────────────────────────────────
#  When you want to preview the public site on the same VPS without a
#  separate domain. Add this snippet INSIDE the existing expressonly.in
#  server { } block (the same one that already includes school.conf).
#
#  Result:
#    https://expressonly.in/info/        → public site (locale redirect)
#    https://expressonly.in/info/en/...  → English page
#    https://expressonly.in/info/pa/...  → Punjabi page
#    https://expressonly.in/school/      → React staff portal (unchanged)

location = /info { return 302 /info/; }

location /info/ {
    alias /opt/school-management/public-site/dist/;
    try_files $uri $uri/ $uri.html $uri/index.html /info/index.html;
}
