# =============================================================================
# TEST nginx snippet — KIS School Management, second instance on the PROD box
# =============================================================================
# TEMPLATE. scripts/provision/06-install-nginx-snippet.sh renders __URL_PREFIX__,
# __APP_ROOT__ and __APP_PORT__ from scripts/deploy/test/env.sh, installs the
# result as /etc/nginx/snippets/<SERVICE_NAME>.conf and appends ONE line —
#     include /etc/nginx/snippets/<SERVICE_NAME>.conf;
# — to the EXISTING server { } block whose server_name is $DOMAIN. On 69.62.72.137
# that block is the bare-IP :80 vhost of the enamfoss app
# (/etc/nginx/conf.d/enamfoss.conf); nothing else in it is touched.
# PROD uses the standalone vhost deploy/nginx.kisschool.conf instead.
#
# Routes (longest-prefix wins, so order here is cosmetic):
#   http://<ip>__URL_PREFIX__/api/*        → FastAPI on 127.0.0.1:__APP_PORT__   (proxy)
#   http://<ip>__URL_PREFIX__/admin/*      → React staff portal SPA (Vite base __URL_PREFIX__/admin/)
#   http://<ip>__URL_PREFIX__/downloads/*  → static files (staging APK + app-version-test.json)
#   http://<ip>__URL_PREFIX__[/]           → 302 → __URL_PREFIX__/admin/  (TEST has no public site)
#
# Living inside someone else's server block:
#  - `^~` on our prefix locations stops nginx from evaluating regex locations for
#    these URLs, so a regex the host app adds later (e.g. a static-asset cache
#    rule) can never hijack our assets or API.
#  - Its `error_page 404 /index.html` still applies to real 404s under our alias
#    locations (status stays 404, body is the host's index.html) — cosmetic.
#    Proxied API errors pass straight through (proxy_intercept_errors is off).
#  - A location that sets any add_header inherits none of the server-level ones,
#    so the no-cache locations below re-declare the host's security headers.

# ── 1. FastAPI ───────────────────────────────────────────────────────────
location ^~ __URL_PREFIX__/api/ {
    proxy_pass         http://127.0.0.1:__APP_PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE-friendly settings (covers __URL_PREFIX__/api/stream/* too)
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    # Allow large file uploads (student docs)
    client_max_body_size 25m;

    # The host block maps 5xx to its own /50x.html (missing on this box → a
    # confusing 404 while the backend restarts). Declaring any error_page here
    # stops that inheritance for the API; answer with a JSON 503 instead.
    error_page 502 503 504 = @kisschool_test_api_down;
}
location @kisschool_test_api_down {
    default_type application/json;
    return 503 '{"detail":"TEST backend unavailable (restarting?)"}';
}

# ── 2. React staff portal SPA (Vite-built; base "__URL_PREFIX__/admin/") ──
location = __URL_PREFIX__/admin { return 302 __URL_PREFIX__/admin/; }

location ^~ __URL_PREFIX__/admin/ {
    alias __APP_ROOT__/frontend/dist/;
    try_files $uri $uri/ __URL_PREFIX__/admin/index.html;
}

# index.html + version.json must always be revalidated so a fresh deploy
# reaches the browser immediately. Vite's hashed assets under /assets/ are
# inherently cache-safe (filename changes on every build).
location = __URL_PREFIX__/admin/ {
    alias __APP_ROOT__/frontend/dist/;
    try_files /index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires off;
}
location = __URL_PREFIX__/admin/index.html {
    alias __APP_ROOT__/frontend/dist/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires off;
}
location = __URL_PREFIX__/admin/version.json {
    alias __APP_ROOT__/frontend/dist/version.json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires off;
}

# ── 3. Direct-download passthrough (staging APK + force-update manifest) ──
location ^~ __URL_PREFIX__/downloads/ {
    alias __APP_ROOT__/frontend/dist/downloads/;
}

# ── 4. No public site on TEST — send the prefix root to the portal ────────
location = __URL_PREFIX__ { return 302 __URL_PREFIX__/admin/; }
location = __URL_PREFIX__/ { return 302 __URL_PREFIX__/admin/; }
