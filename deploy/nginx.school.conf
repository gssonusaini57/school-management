# Add this inside the existing https://expressonly.in nginx server { ... } block
# (provisioning step 06 inserts an `include /etc/nginx/snippets/school.conf;`
# line just before the SSL block's closing brace).
#
# Routes (longest-prefix wins, so order in this file is cosmetic):
#   https://expressonly.in/school/api/*       → FastAPI on 127.0.0.1:8000  (proxy)
#   https://expressonly.in/school/admin/*     → React staff portal SPA
#   https://expressonly.in/school/downloads/* → static files (Android APK, etc.)
#   https://expressonly.in/school/*           → public marketing site (Eleventy)
#   https://expressonly.in/school/            → public marketing site root


# ── 1. FastAPI ───────────────────────────────────────────────────────────
location /school/api/ {
    proxy_pass         http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE-friendly settings (covers /school/api/stream/* too)
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    # Allow large file uploads (student docs)
    client_max_body_size 25m;
}


# ── 2. React staff portal SPA (Vite-built; base "/school/admin/") ────────
location = /school/admin { return 302 /school/admin/; }

location /school/admin/ {
    alias /opt/school-management/frontend/dist/;
    try_files $uri $uri/ /school/admin/index.html;
}


# ── 3. Direct-download passthrough (Android APK + future) ────────────────
# Lives inside the React build at frontend/dist/downloads/, but the URL
# stays at /school/downloads/* so existing teacher bookmarks don't break.
location /school/downloads/ {
    alias /opt/school-management/frontend/dist/downloads/;
}


# ── 4. Public marketing site (Eleventy static; mounted at /school/) ──────
location = /school { return 302 /school/; }

location /school/ {
    alias /opt/school-management/public-site/dist/;
    # Pretty URLs: /school/en/admissions  →  /school/en/admissions/index.html
    # Root → /school/index.html which JS-redirects to /school/en/ or /school/pa/
    try_files $uri $uri/ $uri.html $uri/index.html /school/index.html;
}
